<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trang cá nhân</title>
<style>
:root{--bg:#10111c;--panel:#1b1d2d;--text:#f6f3ff;--muted:#b8b5ca;--accent:#b9a0ff;--card:#25273a}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);transition:background .4s,color .4s}
.wrap{max-width:720px;margin:auto;padding:18px 16px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.brand{font-size:13px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.btn{border:1px solid #ffffff30;border-radius:999px;padding:9px 13px;color:var(--text);background:#ffffff10;text-decoration:none;font-size:13px}
.cover{height:180px;border-radius:24px;background:linear-gradient(120deg,#4f3a78,#d19bbf);background-size:cover;background-position:center;position:relative;overflow:hidden}.profile{text-align:center;margin-top:-55px;position:relative}.avatar{width:110px;height:110px;border:4px solid var(--bg);object-fit:cover;background:#35334a;border-radius:50%;display:inline-block}.avatar.square{border-radius:18px}.avatar.rect{width:140px;height:90px;border-radius:14px;margin-top:20px}.avatar.circle{border-radius:50%}.name{font-size:27px;font-weight:800;margin:12px 0 5px}.note{color:var(--muted);margin:0 auto;max-width:520px;line-height:1.5}.section-title{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:28px 4px 12px}.links{display:flex;flex-direction:column;gap:11px}.link-card{display:flex;align-items:center;gap:13px;padding:12px;border-radius:18px;background:var(--card);border:1px solid #ffffff12;text-decoration:none;color:var(--text);transition:transform .2s,background .2s;animation:rise .55s both}.link-card:hover{transform:translateY(-2px);background:#ffffff1a}.link-img{width:54px;height:54px;border-radius:13px;object-fit:cover;background:#39384d;flex-shrink:0}.link-copy{min-width:0;flex:1}.link-name{font-weight:700}.link-note{font-size:13px;color:var(--muted);margin-top:3px}.arrow{font-size:20px;color:var(--accent);padding:0 5px}.empty{color:var(--muted);text-align:center;padding:30px}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
body.theme-sunset{--bg:#21121c;--panel:#321c2b;--text:#fff5ee;--muted:#e0b9c5;--accent:#ffb18a;--card:#38212f}
body.theme-ocean{--bg:#071c2a;--panel:#103247;--text:#effaff;--muted:#a7c7d7;--accent:#65e0dc;--card:#123448}
body.theme-forest{--bg:#101f19;--panel:#1c3327;--text:#f2fff4;--muted:#b1cbb8;--accent:#a6e6a4;--card:#203b2c}
body.theme-rose{--bg:#28151f;--panel:#3b2030;--text:#fff2f7;--muted:#e1b8ca;--accent:#ff9bc6;--card:#432337}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}body.anim-fade .link-card{animation-name:fade}body.anim-pop .link-card{animation-name:pop}body.anim-slide .link-card{animation-name:slide}body.anim-soft .link-card{animation-name:soft}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}@keyframes slide{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}@keyframes soft{from{opacity:0;filter:blur(5px)}to{opacity:1;filter:blur(0)}}
#intro{position:fixed;inset:0;background:#080812ed;display:none;align-items:center;justify-content:center;padding:24px;z-index:5;text-align:center}#intro .box{max-width:400px;background:var(--card);padding:28px;border-radius:24px}#intro button{margin-top:16px}
@media(min-width:600px){.cover{height:220px}.wrap{padding-top:28px}}
</style>
</head>
<body>
<div id="intro"><div class="box"><div style="font-size:38px">✦</div><h2 id="introTitle">Chào mừng bạn</h2><p id="introText">Ghé thăm góc nhỏ của mình nhé.</p><button class="btn" onclick="closeIntro()">Bắt đầu khám phá</button></div></div>
<main class="wrap">
  <div class="top"><div class="brand" id="siteLabel">MY LITTLE SPACE</div><a class="btn" href="admin.html">⚙ Cài đặt</a></div>
  <div class="cover" id="cover"></div>
  <section class="profile">
    <img class="avatar circle" id="avatar" alt="Ảnh đại diện">
    <h1 class="name" id="name">Tên website</h1><p class="note" id="note">Một vài dòng giới thiệu về mình.</p>
  </section>
  <div class="section-title" id="exploreTitle">Khám phá · Chọn một liên kết</div>
  <section class="links" id="links"></section>
  <div class="footer" id="footer">Được tạo cho riêng mình ✦</div>
</main>
<div id="musicPlayer" style="display:none;margin-top:20px;padding:14px;background:var(--card);border-radius:16px;border:1px solid #ffffff12"><strong>♫ Nhạc của mình</strong><audio id="music" controls loop preload="metadata" style="display:block;width:100%;margin-top:8px"></audio><div style="color:var(--muted);font-size:12px;margin-top:5px">Chạm nút phát để nghe nhạc.</div></div>
<script>
const defaults={siteLabel:"MY LITTLE SPACE",name:"Tên website",note:"Một vài dòng giới thiệu về mình.",avatar:"",cover:"",avatarShape:"circle",theme:"midnight",animation:"rise",exploreTitle:"Khám phá · Chọn một liên kết",footer:"Được tạo cho riêng mình ✦",introEnabled:false,introTitle:"Chào mừng bạn",introText:"Ghé thăm góc nhỏ của mình nhé.",musicUrl:"",musicDataUrl:"",musicFileName:"",links:[{title:"Instagram",note:"Theo dõi những khoảnh khắc của mình",url:"https://instagram.com",image:""},{title:"YouTube",note:"Video và playlist yêu thích",url:"https://youtube.com",image:""},{title:"Liên kết của mình",note:"Thêm mô tả ngắn ở đây",url:"https://example.com",image:""}]};
function getData(){try{return {...defaults,...JSON.parse(localStorage.getItem("bioSiteConfig")||"{}")}}catch(e){return defaults}}
function render(){const d=getData();document.body.className=`theme-${d.theme||"midnight"} anim-${d.animation||"rise"}`;
document.documentElement.style.setProperty("--accent",d.accent||({midnight:"#b9a0ff",sunset:"#ffb18a",ocean:"#65e0dc",forest:"#a6e6a4",rose:"#ff9bc6"}[d.theme]||"#b9a0ff"));
document.getElementById("siteLabel").textContent=d.siteLabel||d.name;document.getElementById("name").textContent=d.name;document.getElementById("note").textContent=d.note;document.getElementById("exploreTitle").textContent=d.exploreTitle;document.getElementById("footer").textContent=d.footer;
const a=document.getElementById("avatar");a.className="avatar "+(d.avatarShape||"circle");a.src=d.avatar||"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><rect width="100%" height="100%" fill="#35334a"/><text x="50%" y="55%" text-anchor="middle" font-size="48" fill="#c9b7ff">✦</text></svg>');
const c=document.getElementById("cover");c.style.backgroundImage=d.cover?`url("${d.cover}")`:"linear-gradient(120deg,#4f3a78,#d19bbf)";
const links=document.getElementById("links");links.innerHTML="";(d.links||[]).forEach((l,i)=>{if(!l.title&&!l.url)return;const el=document.createElement("a");el.className="link-card";el.href=l.url||"#";el.target="_blank";el.rel="noopener noreferrer";el.style.animationDelay=(i*.07)+"s";const img=document.createElement("img");img.className="link-img";img.alt="";img.src=l.image||"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><rect width="100%" height="100%" rx="12" fill="#39384d"/><text x="50%" y="57%" text-anchor="middle" font-size="25" fill="#d2c7ff">↗</text></svg>');const copy=document.createElement("div");copy.className="link-copy";const title=document.createElement("div");title.className="link-name";title.textContent=l.title||"Liên kết";const note=document.createElement("div");note.className="link-note";note.textContent=l.note||"";copy.append(title,note);const arrow=document.createElement("div");arrow.className="arrow";arrow.textContent="↗";el.append(img,copy,arrow);links.appendChild(el)});
const m=document.getElementById("music");const musicSrc=d.musicDataUrl||d.musicUrl||"";document.getElementById("musicPlayer").style.display=musicSrc?"block":"none";if(musicSrc){if(m.src!==musicSrc)m.src=musicSrc;}else{m.removeAttribute("src");m.load();}
if(d.introEnabled&&!sessionStorage.getItem("bioIntroSeen")){document.getElementById("introTitle").textContent=d.introTitle;document.getElementById("introText").textContent=d.introText;document.getElementById("intro").style.display="flex"}
}
function closeIntro(){document.getElementById("intro").style.display="none";sessionStorage.setItem("bioIntroSeen","1")}
render();
</script>
</body></html>
